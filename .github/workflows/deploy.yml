# Deploy workflow — runs on every push to main.
#
# Required GitHub Secrets:
#   SUPABASE_ACCESS_TOKEN  — Personal access token from Supabase Dashboard
#                            Settings → Account → Access Tokens
#   SUPABASE_PROJECT_REF   — Project reference ID from your Supabase project URL
#                            e.g. https://supabase.com/dashboard/project/<ref>
#
# Vercel auto-deploys on push to main independently of this workflow.
# This job runs migrations first so the DB schema is up to date before
# Vercel's build + deployment finishes and starts serving traffic.

name: Deploy

on:
  push:
    branches: [main]

# Prevent two migration runs from overlapping.
# cancel-in-progress: false is intentional — cancelling a migration mid-run
# would leave the database in an indeterminate state.
concurrency:
  group: deploy-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Run DB Migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Push migrations
        # --include-all applies migrations that sort BEFORE the last one already
        # on the remote DB. The migration scheme uses numeric prefixes (009, 010,
        # 011) rather than timestamps, so a lower-numbered migration added after a
        # higher one was pushed (here: 009_avatars_bucket, with 010/011 already
        # remote) is otherwise rejected and the deploy fails. All such migrations
        # are additive/idempotent; applying them out of order is safe.
        run: supabase db push --include-all
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Verify no schema drift
        run: |
          # Pull remote schema and diff against local migrations
          # If drift exists, db diff will output SQL and exit non-zero
          DIFF=$(supabase db diff --linked 2>&1) || true
          if [ -n "$DIFF" ] && ! echo "$DIFF" | grep -q "No schema changes found"; then
            echo "::error::Schema drift detected between remote DB and local migrations:"
            echo "$DIFF"
            exit 1
          fi
          echo "No schema drift — remote DB matches local migrations."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      # Gate-2 (data-mutating-cron-safety): a failed db-mutating run must alert
      # loudly — a red Actions badge is monitored by nobody. Uses the fleet's
      # Resend alert channel (same one mission-control's digest emails use).
      - name: Alert on failure
        if: failure()
        run: |
          curl -sS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer ${{ secrets.RESEND_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg from "${{ secrets.AUTONOMY_ALERT_FROM }}" \
              --arg to "${{ secrets.AUTONOMY_ALERT_TO }}" \
              --arg subject "[${{ github.repository }}] ${{ github.workflow }} FAILED" \
              --arg text "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              '{from: $from, to: [$to], subject: $subject, text: $text}')" \
            || echo "::warning::failure alert could not be sent"
